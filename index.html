                              v.category === 'ocop' ? 'fa-solid fa-award' :
                              v.category === 'gift' ? 'fa-solid fa-gift' :
                              v.category === 'fintech' ? 'fa-solid fa-qrcode' : 'fa-solid fa-wheat-awn'
                            }`}></i>
                            <span className="text-xs font-black tabular-nums mt-0.5">
                              -{Math.round(v.discountAmount / 1000)}k
                            </span>
                            <span className="text-[8px] font-bold uppercase truncate max-w-full">
                              {v.category === 'shipping' ? 'Ship' :
                               v.category === 'ocop' ? 'OCOP' :
                               v.category === 'gift' ? 'Quà biếu' :
                               v.category === 'fintech' ? 'Thanh toán' : 'Vụ mùa'}
                            </span>
                          </div>

                          {/* Center coupon details */}
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-1.5 flex-wrap">
                              <span className="bg-stone-900 text-white text-[9px] font-mono font-bold px-1.5 py-0.2 rounded uppercase">
                                {v.code}
                              </span>
                              <span className="text-[9px] font-bold text-stone-500 bg-stone-100 px-1.5 py-0.2 rounded">
                                {v.badge}
                              </span>
                              <span className="text-[9px] font-bold text-emerald-700 bg-emerald-50 px-1 py-0.2 rounded border border-emerald-200">
                                ✓ Cộng dồn được
                              </span>
                              {isSelected && (
                                <span className="text-[9px] font-bold text-[#EE4D2D] bg-red-100 px-1.5 py-0.2 rounded">
                                  Đang chọn
                                </span>
                              )}
                            </div>

                            <h4 className="text-xs font-bold text-stone-900 mt-1 leading-snug">
                              {v.title}
                            </h4>
                            <p className="text-[11px] text-stone-500 mt-0.5 leading-snug">
                              {v.sub}
                            </p>

                            <div className="flex items-center justify-between text-[10px] mt-1 pt-1 border-t border-stone-100">
                              <span className="text-stone-400">{v.expiry}</span>
                              {!isEligible ? (
                                <span className="text-amber-700 font-semibold">
                                  Mua thêm {formatMoney(v.minSpend - cartSubtotal)} để áp dụng
                                </span>
                              ) : (
                                <span className="text-emerald-700 font-bold">
                                  Đạt điều kiện: -{formatMoney(v.discountAmount)}
                                </span>
                              )}
                            </div>
                          </div>

                          {/* Right selection checkbox */}
                          <div className="shrink-0 flex items-center justify-center">
                            <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${
                              isSelected
                                ? 'bg-[#EE4D2D] border-[#EE4D2D] text-white shadow-xs'
                                : 'border-stone-300 bg-white text-transparent'
                            }`}>
                              <i className="fa-solid fa-check text-xs"></i>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Bottom confirm button */}
                  <div className="pt-2 sticky bottom-0 bg-white border-t border-stone-100">
                    <button
                      onClick={() => {
                        setActiveModal(null);
                        showToast(`Đã áp dụng ${selectedVoucherIds.length} mã giảm giá (Tiết kiệm ${formatMoney(totalVoucherDiscount)})`);
                      }}
                      className="w-full bg-[#EE4D2D] hover:bg-[#D73211] text-white text-xs font-bold py-3.5 rounded-2xl shadow-md flex items-center justify-center gap-2"
                    >
                      <i className="fa-solid fa-ticket"></i>
                      <span>Xác Nhận Dùng {selectedVoucherIds.length} Mã Giảm Giá ({formatMoney(totalVoucherDiscount)})</span>
                    </button>
                  </div>

                </div>
              </div>
            )}


            {/* 10. ADDRESS SHEET MODAL */}
            {activeModal === 'address_sheet' && (
              <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex flex-col justify-end items-center">
                <div className="bg-white rounded-t-[36px] max-h-[85%] overflow-y-auto no-scrollbar p-4 space-y-3 shadow-2xl">
                  <div className="w-10 h-1 bg-stone-300 rounded-full mx-auto"></div>
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-bold text-stone-900">Địa Chỉ Nhận Hàng Hà Nội</h3>
                    <button onClick={() => setActiveModal(null)} className="p-1 text-stone-400">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>

                  <div className="space-y-2">
                    {addresses.map(addr => (
                      <div
                        key={addr.id}
                        onClick={() => {
                          setSelectedAddress(addr);
                          setActiveModal(null);
                          showToast(`Giao đến: ${addr.district}, Hà Nội`);
                        }}
                        className={`p-2.5 rounded-2xl border text-xs cursor-pointer ${
                          selectedAddress.id === addr.id ? 'border-[#EE4D2D] bg-red-50/50' : 'border-stone-200 bg-white'
                        }`}
                      >
                        <div className="flex justify-between font-bold text-stone-900">
                          <span>{addr.receiverName} ({addr.receiverPhone})</span>
                          {addr.isDefault && <span className="text-[9px] bg-stone-200 px-1.5 py-0.2 rounded">Mặc định</span>}
                        </div>
                        <p className="text-stone-600 mt-0.5">{addr.buildingBlock || addr.streetDetails}, {addr.district}, {addr.city}</p>
                      </div>
                    ))}
                  </div>

                  <button
                    onClick={() => {
                      const newA = {
                        id: `addr-${Date.now()}`,
                        title: 'Địa chỉ GPS Tòa Keangnam',
                        receiverName: 'Nguyễn Văn An',
                        receiverPhone: '0988 234 567',
                        houseType: 'apartment',
                        buildingBlock: 'Tòa Landmark 72, Tầng 24',
                        district: 'Cầu Giấy',
                        ward: 'Mễ Trì',
                        city: 'Hà Nội',
                        isDefault: false,
                        lat: 21.0168,
                        lng: 105.7838
                      };
                      setAddresses(p => [...p, newA]);
                      setSelectedAddress(newA);
                      setActiveModal(null);
                      showToast('Đã thêm địa chỉ Cầu Giấy qua GPS (<3s)!');
                    }}
                    className="w-full bg-stone-100 hover:bg-stone-200 text-stone-800 text-xs font-bold py-3 rounded-2xl flex items-center justify-center gap-1.5"
                  >
                    <i className="fa-solid fa-location-crosshairs text-[#EE4D2D]"></i>
                    Lấy vị trí GPS Hà Nội (&lt;3s)
                  </button>
                </div>
              </div>
            )}

            {/* 11. SHIPPER SCAN MODAL */}
            {activeModal === 'shipper_scan' && (
              <div className="fixed inset-0 bg-stone-950 z-50 flex flex-col justify-between items-center p-6 text-white text-center">
                <div className="flex justify-between items-center pt-2">
                  <span className="text-xs font-bold uppercase text-[#EE4D2D]">Giao Vận Scanner · Tuyến CT05</span>
                  <button onClick={() => setActiveModal(null)} className="p-1 rounded-full bg-white/20">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>
                <div className="my-auto flex flex-col items-center">
                  <div className="relative w-56 h-56 border-2 border-dashed border-[#EE4D2D] rounded-3xl flex items-center justify-center overflow-hidden">
                    <i className="fa-solid fa-qrcode text-7xl text-[#EE4D2D]/80"></i>
                    <div className="absolute inset-x-0 h-1 bg-[#EE4D2D] animate-scanline"></div>
                  </div>
                  <p className="text-xs text-stone-400 mt-3">Quét mã vận đơn nhận hàng từ xe khách CT05</p>
                </div>
                <button
                  onClick={() => { setActiveModal(null); showToast('Đã quét nhận kiện hàng thành công!'); }}
                  className="w-full bg-[#EE4D2D] text-white text-xs font-bold py-3.5 rounded-2xl"
                >
                  Xác Nhận Quét Nhận Kiện
                </button>
              </div>
            )}

            {/* FLOATING TOAST NOTIFICATION */}
            {toastMsg && (
              <div className="fixed top-24 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-stone-900/95 backdrop-blur-md text-white text-xs px-4 py-3 rounded-2xl shadow-2xl z-50 flex items-center gap-2 border border-stone-800">
                <i className="fa-solid fa-circle-check text-emerald-400 shrink-0"></i>
                <span className="truncate">{toastMsg}</span>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
